version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: fonebox-postgres
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: fonebox_crm
    volumes:
      - fonebox_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: fonebox-api
    ports:
      - '4000:4000'
    depends_on:
      db:
        condition: service_healthy
    environment:
      - NODE_ENV=development
      - PORT=4000
      - DATABASE_URL=postgresql://postgres:password@db:5432/fonebox_crm?schema=public
    volumes:
      - ./apps/api:/usr/src/app/apps/api
      - ./packages:/usr/src/app/packages
      - ./prisma:/usr/src/app/prisma

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: fonebox-web
    ports:
      - '3000:3000'
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=http://localhost:4000/api/v1
    volumes:
      - ./apps/web:/usr/src/app/apps/web
      - ./packages:/usr/src/app/packages

volumes:
  fonebox_pgdata:
